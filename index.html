<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to MyIelts7</title>
    <style>
        :root {
            --primary: #0f172a;
            --bg: #1e293b;
            --surface: #334155;
            --border: #475569;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .welcome-container {
            background-color: var(--primary);
            border: 1px solid var(--border);
            max-width: 650px;
            width: 100%;
            border-radius: 16px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .welcome-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: var(--accent);
            border-radius: 0 0 4px 4px;
        }

        .platform-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid var(--accent);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: -0.03em;
        }

        h1 span {
            color: var(--accent);
        }

        .welcome-message {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #e2e8f0;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            padding: 18px 40px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.25s ease;
            letter-spacing: 0.02em;
        }

        .cta-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 35px;
            font-size: 0.82rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(71, 85, 105, 0.4);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="platform-badge">Official Preparation Hub</div>
        
        <h1>Welcome to <span>MyIelts7</span></h1>
        
        <p class="welcome-message">
            Hello IELTS takers. Welcome to MyIelts7, a platform for practicing all skills. Our goal is reaching to the best.
        </p>

        <a href="app.html" class="cta-button">🚀 Open Sprint Tracks (Day 1)</a>

        <div class="footer-note">
            Equipped with 56 fully unique, daily macro-dynamic exam simulation blueprints.
        </div>
    </div>

</body>
</html>
